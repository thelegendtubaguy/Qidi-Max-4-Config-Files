schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  specs:
    - Keep only repository-controlled observable behavior; put implementation mechanics in design, code, or tests.
    - State shared behavior once instead of repeating it for each firmware, slicer, entrypoint, or operation.
    - Reference installer/package.yaml and openspec/contracts for exhaustive values, hashes, variants, command order, and forbidden patterns.
    - Use the fewest scenarios that distinguish materially different success, safety, ownership, or failure outcomes.
