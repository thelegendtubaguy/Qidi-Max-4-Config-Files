# Optimized print-start entry helpers

[gcode_macro _OPTIMIZED_STAGGERED_START_EXPLICIT]
description: Sequentially heats explicit print-start targets.
gcode:
  {% set bed_target = params.BEDTEMP|default(0)|float %}
  {% set chamber_target = params.CHAMBER|default(0)|float %}
  {% set probe_target = params.PROBETEMP|float %}
  {% set dwell_ms = (params.DWELL|default(0)|float * 1000)|int %}
  {% set chamber_available = printer["heater_generic chamber"] is defined %}
  M104 S0
  {% if chamber_available %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
  {% endif %}
  {% if bed_target > 0 %}
    OPTIMIZED_WAIT_BED S={bed_target}
    {% if dwell_ms > 0 %}
      G4 P{dwell_ms}
    {% endif %}
  {% endif %}
  {% if chamber_available and chamber_target > 0 %}
    OPTIMIZED_WAIT_CHAMBER S={chamber_target}
    {% if dwell_ms > 0 %}
      G4 P{dwell_ms}
    {% endif %}
  {% endif %}
  M104 S{probe_target}

[gcode_macro _OPTIMIZED_STAGGERED_START_ACTIVE]
description: Sequentially heats targets established by prior slicer G-code.
gcode:
  {% set bed_target = printer.heater_bed.target|float %}
  {% set chamber_available = printer["heater_generic chamber"] is defined %}
  {% set chamber_target = printer["heater_generic chamber"].target|float if chamber_available else 0 %}
  {% set probe_target = params.PROBETEMP|float %}
  {% set dwell_ms = (params.DWELL|default(0)|float * 1000)|int %}
  M104 S0
  {% if chamber_available %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET=0
  {% endif %}
  {% if bed_target > 0 %}
    SET_PRINT_SUB_STATUS SUB_STATUS=bed_heating
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={([bed_target - 1, 0]|max)}
    {% if dwell_ms > 0 %}
      G4 P{dwell_ms}
    {% endif %}
  {% endif %}
  {% if chamber_available and chamber_target > 0 %}
    SET_PRINT_SUB_STATUS SUB_STATUS=chamber_heating
    {% if printer["fan_generic chamber_circulation_fan"] is defined %}
      SET_FAN_SPEED FAN=chamber_circulation_fan SPEED=0
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=chamber TARGET={chamber_target}
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={([chamber_target - 3, 0]|max)}
    {% if dwell_ms > 0 %}
      G4 P{dwell_ms}
    {% endif %}
  {% endif %}
  M104 S{probe_target}

[gcode_macro OPTIMIZED_PRINT_START_HOME]
description: Applies configured print-start heating before homing.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {% set svv = printer.save_variables.variables %}
  {% set probe_target = km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else 140 %}
  {% set explicit_targets = "BEDTEMP" in params or "CHAMBER" in params %}
  {% set bed_target = params.BEDTEMP|default(0)|float %}
  {% set chamber_target = params.CHAMBER|default(0)|float %}
  {% set staggered_heating = svv.tltg_staggered_start_heating|default(opt.staggered_start_heating)|int %}
  {% set dwell_seconds = ([svv.tltg_staggered_start_heating_dwell_seconds|default(opt.staggered_start_heating_dwell_seconds)|float, 0]|max) %}
  UPDATE_DELAYED_GCODE ID=_optimized_end_fan_cooldown_off DURATION=0
  {% if staggered_heating %}
    {% if explicit_targets %}
      _OPTIMIZED_STAGGERED_START_EXPLICIT BEDTEMP={bed_target} CHAMBER={chamber_target} PROBETEMP={probe_target} DWELL={dwell_seconds}
    {% else %}
      _OPTIMIZED_STAGGERED_START_ACTIVE PROBETEMP={probe_target} DWELL={dwell_seconds}
    {% endif %}
  {% else %}
    {% if "BEDTEMP" in params %}
      M140 S{bed_target}
    {% endif %}
    {% if "CHAMBER" in params %}
      M141 S{chamber_target}
    {% endif %}
    M104 S{probe_target}
  {% endif %}
  SET_PRINT_SUB_STATUS SUB_STATUS=tool_head_reset
  G28
