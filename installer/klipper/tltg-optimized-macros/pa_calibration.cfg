[tltg_pa_calibration]
developer_capture: False

[gcode_macro TLTG_PA_CALIBRATE]
description: Load-cell PA calibration; disabled pending hardware validation.
gcode:
  {% if params.TEMP is not defined or params.NOZZLE is not defined %}
    {action_raise_error("TLTG_PA_CALIBRATE requires TEMP=<celsius> NOZZLE=<0.2|0.4|0.6|0.8>")}
  {% endif %}
  _TLTG_PA_CALIBRATE TEMP={params.TEMP} NOZZLE={params.NOZZLE}
