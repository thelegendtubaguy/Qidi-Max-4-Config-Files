# Optimized filament prep and toolchange helpers

[filament_switch_sensor filament_switch_sensor]
pause_on_runout: False
runout_gcode:
  OPTIMIZED_FILAMENT_SENSOR_RUNOUT
insert_gcode:
  OPTIMIZED_FILAMENT_SENSOR_INSERTED
event_delay: 3.0
pause_delay: 0.5
switch_pin: !THR:PA0

[gcode_macro TLTG_FILAMENT_SENSOR]
description: Enables or disables automatic external-spool filament-runout pausing.
variable_pause_enabled: 1
gcode:
  {% if params.ENABLE is not defined or params.ENABLE not in ["0", "1"] %}
    {action_raise_error("TLTG_FILAMENT_SENSOR requires ENABLE=0 or ENABLE=1")}
  {% else %}
    {% set pause_enabled = params.ENABLE|int %}
    SET_GCODE_VARIABLE MACRO=TLTG_FILAMENT_SENSOR VARIABLE=pause_enabled VALUE={pause_enabled}
    {% if pause_enabled %}
      {action_respond_info("TLTG_FILAMENT_SENSOR: automatic external-spool runout pausing ENABLED. QIDI Box runout handling remains enabled.")}
    {% else %}
      {action_respond_info("TLTG_FILAMENT_SENSOR: automatic external-spool runout pausing DISABLED. Sensor events and runout status reporting remain active; QIDI Box runout handling remains enabled.")}
    {% endif %}
  {% endif %}

[gcode_macro _TLTG_ENSURE_TOOL_MAPPINGS]
description: Creates missing identity mappings for active QIDI Box slots.
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_count = svv.box_count|default(0)|int %}
  {% set active_tool_count = [box_count * 4, 16]|min if box_available and box_count > 0 else 0 %}
  {% for tool in range(active_tool_count) %}
    {% set variable = 'value_t' ~ tool %}
    {% set current = svv[variable]|default('')|string|trim %}
    {% if not current %}
      SAVE_VARIABLE VARIABLE={variable} VALUE='"slot{tool}"'
    {% endif %}
  {% endfor %}

[gcode_macro _TLTG_RESET_TOOL_MAPPINGS]
description: Restores existing QIDI Box mappings and missing active mappings to identity.
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_count = svv.box_count|default(0)|int %}
  {% set active_tool_count = [box_count * 4, 16]|min if box_available and box_count > 0 else 0 %}
  {% set changed = namespace(count=0) %}
  {% for tool in range(16) %}
    {% set variable = 'value_t' ~ tool %}
    {% set expected = 'slot' ~ tool %}
    {% set exists = variable in svv %}
    {% set current = svv[variable]|default('')|string|trim %}
    {% if (exists and current != expected) or (not exists and tool < active_tool_count) %}
      SAVE_VARIABLE VARIABLE={variable} VALUE='"{expected}"'
      {% set changed.count = changed.count + 1 %}
    {% endif %}
  {% endfor %}
  {% if params.REPORT|default(0)|int %}
    {action_respond_info("TLTG_RESET_TOOL_MAPPINGS: reset %d tool-slot mapping(s)." % changed.count)}
  {% endif %}

[gcode_macro TLTG_RESET_TOOL_MAPPINGS]
description: Restores QIDI Box tool-to-slot identity mappings while the printer is idle.
gcode:
  {% set print_active =
       printer.idle_timeout.state|string == "Printing" or
       (printer.virtual_sdcard|default({})).is_active|default(False) or
       printer.pause_resume.is_paused %}
  {% if print_active %}
    {action_raise_error("TLTG_RESET_TOOL_MAPPINGS requires an idle printer")}
  {% else %}
    _TLTG_RESET_TOOL_MAPPINGS REPORT=1
  {% endif %}

[gcode_macro OPTIMIZED_FILAMENT_SENSOR_RUNOUT]
gcode:
  {% set sensor = printer["gcode_macro TLTG_FILAMENT_SENSOR"] %}
  {% set box_enabled = printer.save_variables.variables.enable_box|default(0)|int == 1 and printer["box_extras"] is defined %}
  {% if box_enabled %}
    {action_respond_info("TLTG_FILAMENT_SENSOR: TOOLHEAD SENSOR TRIPPED. QIDI Box handling will pause and run its configured recovery path.")}
    PAUSE
  {% elif sensor.pause_enabled|int %}
    {action_respond_info("TLTG_FILAMENT_SENSOR: TOOLHEAD SENSOR TRIPPED. External-spool runout pausing is ENABLED; pausing now.")}
    PAUSE
  {% else %}
    {action_respond_info("TLTG_FILAMENT_SENSOR: TOOLHEAD SENSOR TRIPPED. External-spool runout pausing is DISABLED; print continues and runout status is being recorded.")}
  {% endif %}
  M118 Filament run out
  {% if box_enabled %}
    {% set can_auto_reload = printer.save_variables.variables.auto_reload_detect|default(0) %}
    {% if can_auto_reload == 1 %}
      AUTO_RELOAD_FILAMENT
    {% else %}
      SET_PRINT_SUB_STATUS SUB_STATUS=box_filament_exhausted
    {% endif %}
  {% else %}
    SET_PRINT_SUB_STATUS SUB_STATUS=ext_filament_exhausted
  {% endif %}

[gcode_macro OPTIMIZED_FILAMENT_SENSOR_INSERTED]
gcode:
  {action_respond_info("TLTG_FILAMENT_SENSOR: TOOLHEAD SENSOR UNTRIPPED. Filament detected.")}
  M118 Filament detected

[gcode_macro OPTIMIZED_CUT_FILAMENT]
description: Faster cutter macro without the stock exit dwell.
gcode:
  {% set saved_accel = printer.toolhead.max_accel|float %}
  SAVE_GCODE_STATE NAME=optimized_cut_filament_state
  G90
  _CG28
  M204 S10000
  {% if (printer.gcode_move.position.x) < 15 %}
    G1 X15 F9000
    G1 Y0 F9000
  {% endif %}
  M400
  G1 Y0 F15000
  G1 X15 F15000
  G1 X3 F8000
  M83
  G1 E-4 F1000
  G1 X4 F1000
  G1 X3 F8000
  G1 X15 F8000
  SET_VELOCITY_LIMIT ACCEL={saved_accel}
  RESTORE_GCODE_STATE NAME=optimized_cut_filament_state

[gcode_macro OPTIMIZED_UNLOAD_FILAMENT]
description: Box unload wrapper that also clears retained-tool state.
gcode:
    {% set box_available = printer["box_extras"] is defined %}
    {% set box_enabled = printer.save_variables.variables.enable_box|default(0)|int == 1 and box_available %}
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=0
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    {% if box_enabled %}
        {% set T = params.T|int %}
        {% set cleanup = params.CLEANUP|default(1)|int %}
        {% set saved_accel = printer.toolhead.max_accel|float %}
        SAVE_GCODE_STATE NAME=optimized_unload_filament_state
        G90
        M83
        CUT_FILAMENT T={T}
        OPTIMIZED_MOVE_TO_TRASH
        UNLOAD_T{T}
        G1 E25 F300
        {% if cleanup %}
            M104 S0
            CLEAR_OOZE
            CLEAR_FLUSH
        {% endif %}
        SET_VELOCITY_LIMIT ACCEL={saved_accel}
        RESTORE_GCODE_STATE NAME=optimized_unload_filament_state
    {% endif %}

[gcode_macro OPTIMIZED_WIPE_AND_SCRAPE_NOZZLE]
description: Softens external-spool nozzle ooze, wipes at the chute, and scrapes at the rear bed without purging.
gcode:
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set scrape_target = params.TARGET|default(km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else 140)|int %}
  {% set scrape_maximum = scrape_target + 10 %}
  {% set box_available = printer["box_extras"] is defined %}

  SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
  M104 S{scrape_target}
  OPTIMIZED_MOVE_TO_TRASH
  OPTIMIZED_WAIT_HOTEND S={scrape_target} STATUS=clear_nozzle
  TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MAXIMUM={scrape_maximum}
  M106 S255
  {% if box_available %}
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}
  OPTIMIZED_MOVE_TO_TRASH
  G1 Y395 F6000
  G1 X188
  G1 Z-0.2 F480
  G91
  G1 X15 F200
  G1 Y2
  G1 X-15
  G1 Y-2
  G1 X15
  G90
  G2 I0.5 J0.5 F480
  G2 I0.5 J0.5
  G2 I0.5 J0.5
  G1 Z10
  G1 Y383 F12000
  M106 S0
  M106 P2 S0

[gcode_macro OPTIMIZED_START_PRINT_FILAMENT_PREP]
description: Handles print-start filament prep and optional same-tool reuse.
gcode:
  {% set tool = params.EXTRUDER|int %}
  {% if params.FIRSTLAYERTEMP is not defined or params.PURGETEMP is not defined %}
    {action_raise_error("OPTIMIZED_START_PRINT_FILAMENT_PREP requires FIRSTLAYERTEMP and PURGETEMP")}
  {% endif %}
  {% set first_layer_temp = params.FIRSTLAYERTEMP|int %}
  {% set purge_temp = params.PURGETEMP|int %}
  {% set bed_target = params.BEDTEMP|int %}
  {% set chamber_target = params.CHAMBER|default(0)|int %}
  {% set km = printer["gcode_macro _km_globals"] %}
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {% set svv = printer.save_variables.variables %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_enabled = svv.enable_box|default(0)|int == 1 and box_available %}
  {% set retained_tool_ready = svv.retained_tool_ready|default(0)|int %}
  {% set retained_slot = svv.retained_slot|default('slot-1') %}
  {% set retained_filament_id = svv.retained_filament_id|default(-1)|int %}
  {% set retained_vendor_id = svv.retained_vendor_id|default(-1)|int %}
  {% set filament_present = printer['filament_switch_sensor filament_switch_sensor'].filament_detected %}
  {% set tool_slot = svv['value_t' ~ tool]|default('slot' ~ tool) %}
  {% set current_filament_id = svv['filament_' ~ tool_slot]|default(-1)|int %}
  {% set current_vendor_id = svv['vendor_' ~ tool_slot]|default(-1)|int %}
  {% set slot_sync = svv.slot_sync|default('slot-1') %}
  {% set reuse_loaded = opt.keep_loaded_between_prints|int and box_enabled and retained_tool_ready and filament_present and retained_slot == tool_slot and slot_sync == retained_slot and current_filament_id == retained_filament_id and current_vendor_id == retained_vendor_id %}
  {% set reuse_nozzle_target = km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else ((km.start_extruder_preheat_scale * purge_temp)|round(0, 'ceil')|int) %}
  {% set scrape_target = km.start_extruder_probing_temp if km.start_extruder_probing_temp > 0 else 140 %}
  {% set scrape_maximum = scrape_target + 10 %}

  G31
  SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=0

  {% if reuse_loaded %}
    SAVE_VARIABLE VARIABLE=retained_tool VALUE={tool}
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"{retained_slot}"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE={retained_filament_id}
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE={retained_vendor_id}
    M118 Reusing retained filament on T{tool}
    M104 S{reuse_nozzle_target}
    {% if bed_target > 0 %}
      M140 S{bed_target}
    {% endif %}
    {% if chamber_target > 0 %}
      M141 S{chamber_target}
    {% endif %}
    G1 Z20 F480
    OPTIMIZED_MOVE_TO_TRASH
    {% if bed_target > 0 %}
      OPTIMIZED_WAIT_BED S={bed_target} STATUS=wait_bed_temp
    {% endif %}
    {% if chamber_target > 0 %}
      OPTIMIZED_WAIT_CHAMBER S={chamber_target} STATUS=wait_chamber_temp
    {% endif %}
    OPTIMIZED_WAIT_HOTEND S={reuse_nozzle_target} STATUS=clear_nozzle
    M83
    G92 E0
    G1 E-0.2 F1800
    M106 S255
    CLEAR_OOZE
    CLEAR_FLUSH
    M106 S0
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    _OPTIMIZED_REPORT_BED_TEMP
    Z_TILT_ADJUST
    M400
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _OPTIMIZED_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
    M1002 A1
    G1 X380 Y5 F20000
    ENABLE_ALL_SENSOR
  {% elif box_enabled %}
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    SET_PRINT_SUB_STATUS SUB_STATUS=change_filament
    BOX_PRINT_START EXTRUDER={tool} HOTENDTEMP={purge_temp}
    M400
    OPTIMIZED_EXTRUSION_AND_FLUSH PURGETEMP={purge_temp} CHAMBER={chamber_target}
    SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
    G1 Z20 F480
    OPTIMIZED_MOVE_TO_TRASH
    G1 E-0.2 F1800
    M104 S{scrape_target}
    {% if purge_temp > scrape_target %}
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={purge_temp}
    {% endif %}
    CLEAR_OOZE
    CLEAR_FLUSH
    {% if purge_temp - 30 > scrape_target %}
      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={purge_temp - 30}
      CLEAR_OOZE
      CLEAR_FLUSH
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={scrape_maximum}
    CLEAR_OOZE
    CLEAR_FLUSH
    OPTIMIZED_MOVE_TO_TRASH
    G1 Y395 F6000
    G1 X188
    G1 Z-0.2 F480
    G91
    G1 X15 F200
    G1 Y2
    G1 X-15
    G1 Y-2
    G1 X15
    G90
    G2 I0.5 J0.5 F480
    G2 I0.5 J0.5
    G2 I0.5 J0.5
    G1 Z10
    G1 Y383 F12000
    M106 S0
    M106 P2 S0
    {% if bed_target > 0 %}
      OPTIMIZED_WAIT_BED S={bed_target} STATUS=wait_bed_temp
    {% endif %}
    {% if chamber_target > 0 %}
      OPTIMIZED_WAIT_CHAMBER S={chamber_target} STATUS=wait_chamber_temp
    {% endif %}
    G1 X15 Y202.5 F36000
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    _OPTIMIZED_REPORT_BED_TEMP
    Z_TILT_ADJUST
    M400
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _OPTIMIZED_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
    M1002 A1
    G1 X380 Y5 F20000
    ENABLE_ALL_SENSOR
  {% else %}
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    M118 Starting without QIDI Box filament prep
    {% if bed_target > 0 %}
      M140 S{bed_target}
    {% endif %}
    {% if chamber_target > 0 %}
      M141 S{chamber_target}
    {% endif %}
    OPTIMIZED_WIPE_AND_SCRAPE_NOZZLE TARGET={scrape_target}
    {% if chamber_target == 0 %}
      M106 P3 S255
    {% else %}
      M106 P3 S0
    {% endif %}
    {% if bed_target > 0 %}
      OPTIMIZED_WAIT_BED S={bed_target} STATUS=wait_bed_temp
    {% endif %}
    {% if chamber_target > 0 %}
      OPTIMIZED_WAIT_CHAMBER S={chamber_target} STATUS=wait_chamber_temp
    {% endif %}
    SET_PRINT_SUB_STATUS SUB_STATUS=z_tilt_adjust
    _OPTIMIZED_REPORT_BED_TEMP
    Z_TILT_ADJUST
    M400
    SET_PRINT_SUB_STATUS SUB_STATUS=auto_bed_adjust
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _OPTIMIZED_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
    M1002 A1
    G1 X380 Y5 F20000
    ENABLE_ALL_SENSOR
  {% endif %}

[gcode_macro OPTIMIZED_END_PRINT_FILAMENT_PREP]
description: Optionally keeps the current box filament loaded between prints.
variable_retained: 0
gcode:
  {% set tool = params.T|default(-1)|int %}
  {% set opt = printer["gcode_macro _tltg_optimized_globals"] %}
  {% set svv = printer.save_variables.variables %}
  {% set box_available = printer["box_extras"] is defined %}
  {% set box_enabled = svv.enable_box|default(0)|int == 1 and box_available %}
  {% set filament_present = printer['filament_switch_sensor filament_switch_sensor'].filament_detected %}
  {% set tool_slot = svv['value_t' ~ tool]|default('slot' ~ tool) %}
  {% set slot_sync = svv.slot_sync|default('slot-1') %}
  {% set active_slot = slot_sync if slot_sync != 'slot-1' else tool_slot %}
  {% set active_tool = namespace(value=tool) %}
  {% for candidate in range(16) %}
    {% if svv['value_t' ~ candidate]|default('slot' ~ candidate) == active_slot %}
      {% set active_tool.value = candidate %}
    {% endif %}
  {% endfor %}
  {% set active_filament_id = svv['filament_' ~ active_slot]|default(-1)|int %}
  {% set active_vendor_id = svv['vendor_' ~ active_slot]|default(-1)|int %}
  {% set keep_loaded = opt.keep_loaded_between_prints|int and box_enabled and tool >= 0 and active_slot != 'slot-1' and filament_present %}

  {% if keep_loaded %}
    SET_GCODE_VARIABLE MACRO=OPTIMIZED_END_PRINT_FILAMENT_PREP VARIABLE=retained VALUE=1
    SAVE_VARIABLE VARIABLE=retained_tool VALUE={active_tool.value}
    SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=1
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"{active_slot}"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE={active_filament_id}
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE={active_vendor_id}
    M118 Retaining filament on T{active_tool.value} for next print
  {% else %}
    SET_GCODE_VARIABLE MACRO=OPTIMIZED_END_PRINT_FILAMENT_PREP VARIABLE=retained VALUE=0
    SAVE_VARIABLE VARIABLE=retained_tool VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_tool_ready VALUE=0
    SAVE_VARIABLE VARIABLE=retained_slot VALUE='"slot-1"'
    SAVE_VARIABLE VARIABLE=retained_filament_id VALUE=-1
    SAVE_VARIABLE VARIABLE=retained_vendor_id VALUE=-1
    SAVE_GCODE_STATE NAME=optimized_end_print_filament_prep_state
    M83
    G1 E-3 F1800
    RESTORE_GCODE_STATE NAME=optimized_end_print_filament_prep_state
    OPTIMIZED_UNLOAD_FILAMENT T={tool} CLEANUP=0
  {% endif %}

[gcode_macro RESUME]
rename_existing: _KM_RESUME_BASE
gcode:
  {% set sensor = printer["gcode_macro TLTG_FILAMENT_SENSOR"] %}
  {% if printer['pause_resume'].is_paused|int == 1 %}
    {% if printer.save_variables.variables.box_count >= 1 and printer["box_extras"] %}
      {% if printer.save_variables.variables.enable_box == 1 %}
        TRY_RESUME_PRINT
      {% elif sensor.pause_enabled|int == 0 or printer['filament_switch_sensor filament_switch_sensor'].filament_detected == True %}
        RESUME_PRINT
      {% else %}
        M118 Please load filament
      {% endif %}
    {% elif sensor.pause_enabled|int == 0 or printer['filament_switch_sensor filament_switch_sensor'].filament_detected == True %}
      RESUME_PRINT
    {% else %}
      M118 Please load filament
    {% endif %}
  {% endif %}

[gcode_macro OPTIMIZED_END_NOZZLE_COOLDOWN_START]
description: Captures the active hotend target and starts shutdown cooldown from the purge chute.
gcode:
  M106 S255
  {% set extruder = printer.toolhead.extruder %}
  {% set hotend = printer[extruder] %}
  {% set hotend_target = hotend.target|float %}
  {% set fallback_start_temp = hotend_target if hotend_target > 0 else hotend.temperature|float %}
  {% set start_temp = params.START_TEMP|default(fallback_start_temp)|float %}
  {% set exhaust_speed = params.EXHAUST_SPEED|default(0)|int %}
  {% set exhaust_duration = params.EXHAUST_DURATION|default(180)|int %}
  SET_GCODE_VARIABLE MACRO=OPTIMIZED_END_STAGED_NOZZLE_WIPE VARIABLE=start_temp VALUE={start_temp}
  OPTIMIZED_DISABLE_BOX_HEATER
  M141 S0
  M140 S0
  M104 S0
  DISABLE_ALL_SENSOR
  {% if exhaust_speed > 0 %}
    OPTIMIZED_END_FAN_COOLDOWN S={exhaust_speed} T={exhaust_duration}
  {% else %}
    OPTIMIZED_END_FAN_COOLDOWN S=0 T=0
  {% endif %}

[gcode_macro OPTIMIZED_END_STAGED_NOZZLE_WIPE]
description: Waits for staged hotend cooldown and wipes the purge-chute nozzle wiper twice.
variable_start_temp: 0
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% set stored_start_temp = printer["gcode_macro OPTIMIZED_END_STAGED_NOZZLE_WIPE"].start_temp|default(0)|float %}
  {% set start_temp = params.START_TEMP|default(stored_start_temp)|float %}
  {% set first_wipe_temp = [0, start_temp - 40]|max %}
  {% set final_wipe_temp = params.FINAL_TEMP|default(140)|float %}
  {% set pull_forward_y = params.PULL_FORWARD_Y|default(30)|float %}
  {% set box_available = printer["box_extras"] is defined %}

  SET_PRINT_SUB_STATUS SUB_STATUS=clear_nozzle
  {% if first_wipe_temp > 0 %}
    TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={first_wipe_temp}
  {% endif %}
  {% if box_available %}
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}
  TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={final_wipe_temp}
  {% if box_available %}
    CLEAR_OOZE
    CLEAR_FLUSH
  {% endif %}
  SAVE_GCODE_STATE NAME=optimized_end_staged_nozzle_wipe_state
  G91
  G1 Y-{pull_forward_y} F6000
  RESTORE_GCODE_STATE NAME=optimized_end_staged_nozzle_wipe_state

[gcode_macro OPTIMIZED_END_NOZZLE_CLEANUP]
description: Backward-compatible end cleanup alias for the staged cooldown wipe sequence.
gcode:
  OPTIMIZED_MOVE_TO_TRASH
  OPTIMIZED_END_NOZZLE_COOLDOWN_START {rawparams}
  OPTIMIZED_END_STAGED_NOZZLE_WIPE

[gcode_macro OPTIMIZED_EXTRUSION_AND_FLUSH]
gcode:
    {% set purge_temp = params.PURGETEMP|int %}
    {% set chamber = params.CHAMBER|default(0)|int %}
    {% set box_available = printer["box_extras"] is defined %}
    {% set box_enabled = printer.save_variables.variables.box_count|default(0)|int > 0 and printer.save_variables.variables.enable_box|default(0)|int == 1 and box_available %}
    {% if box_enabled %}
      SET_PRINT_SUB_STATUS SUB_STATUS=flush_filament
      OPTIMIZED_MOVE_TO_TRASH
      OPTIMIZED_WAIT_HOTEND S={purge_temp} STATUS=flush_filament
      M83
      M106 S0
      M106 P2 S0
      G1 E10 F300
      G1 E-2 F1800
      M106 S127
      M106 P2 S127
      {% for i in range(1,3) %}
        M400
        G1 E60 F300
        G1 E-2 F1800
      {% endfor %}
      M400
      M106 S255
      M106 P2 S255
      {% if chamber == 0 %}
        M106 P3 S255
      {% else %}
        M106 P3 S0
      {% endif %}
      OPTIMIZED_M1004
      G4 P5000
      CLEAR_OOZE
      CLEAR_FLUSH
    {% endif %}

    {% if printer['filament_switch_sensor filament_switch_sensor'].filament_detected == False %}
      M118 Filament run out
      PAUSE
      {% set box_available = printer["box_extras"] is defined %}
      {% set box_enabled = printer.save_variables.variables.enable_box|default(0)|int == 1 and box_available %}
      {% if box_enabled %}
        SET_PRINT_SUB_STATUS SUB_STATUS=box_filament_exhausted
      {% else %}
        SET_PRINT_SUB_STATUS SUB_STATUS=ext_filament_exhausted
      {% endif %}
    {% endif %}
