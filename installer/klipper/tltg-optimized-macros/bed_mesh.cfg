# Optimized bed-mesh helpers

[gcode_macro _OPTIMIZED_G29_HOME_Z_OR_FULL]
description: Homes Z only when XY is already homed; otherwise runs full home.
gcode:
  {% set homed = printer.toolhead.homed_axes|lower %}
  {% if 'x' in homed and 'y' in homed %}
        _OPTIMIZED_HOME_Z_FROM_SAFE_POINT
  {% else %}
        G28
  {% endif %}

[gcode_macro _OPTIMIZED_PREPARE_PRINT_MESH]
description: Loads the configured saved mesh or calibrates a fresh adaptive mesh.
gcode:
  {% set profile = printer.save_variables.variables.tltg_start_bed_mesh_profile|default('')|string %}
  {% set command_profile = profile|replace('\\','\\\\')|replace('"','\\"') %}
  {% if profile %}
    {action_respond_info("Loading saved bed mesh profile: %s" % profile)}
    G32
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    BED_MESH_PROFILE LOAD="{command_profile}"
  {% else %}
    {action_respond_info("Calibrating fresh adaptive KAMP bed mesh")}
    G31
    SET_STEPPER_ENABLE STEPPER=extruder enable=0
    BED_MESH_CLEAR
    _OPTIMIZED_G29_HOME_Z_OR_FULL
    BED_MESH_CALIBRATE PROFILE=kamp
    SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    G4 P500
    SAVE_CONFIG_QD
  {% endif %}

[gcode_macro OPTIMIZED_G29_ZSAFE]
description: Optimized G29 variant that avoids redundant XY rehome when possible.
gcode:
  SET_STEPPER_ENABLE STEPPER=extruder enable=0
  BED_MESH_CLEAR
  _OPTIMIZED_G29_HOME_Z_OR_FULL
  BED_MESH_CALIBRATE PROFILE=kamp
  SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
  G4 P500
  SAVE_CONFIG_QD
