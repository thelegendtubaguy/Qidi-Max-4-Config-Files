  display_name: QIDI Max 4 Optimized
  printer_model: qidi-max4
  version: "26.08.06.2"
  known_versions:
    - "26.04.21.1"
    - "26.04.27.1"
    - "26.04.27.2"
    - "26.04.27.3"
    - "26.04.27.4"
    - "26.05.04.1"
    - "26.05.19.1"
    - "26.05.20.1"
    - "26.05.21.1"
    - "26.05.27.1"
    - "26.06.01.1"
    - "26.06.02.1"
    - "26.06.03.1"
    - "26.06.04.1"
    - "26.06.11.1"
    - "26.06.13.1"
    - "26.06.15.1"
    - "26.07.03.1"
    - "26.07.03.2"
    - "26.07.13.1"
    - "26.07.13.2"
    - "26.07.26.1"
    - "26.07.26.2"
    - "26.07.28.1"
    - "26.08.05.1"
    - "26.08.06.1"
    - "26.08.06.2"

firmware:
  supported:
    - "01.01.06.03"
    - "01.01.06.04"
    - "01.01.06.05"

backup:
  source_directory: "config"
  label_prefix: "tltg-optimized-macros-before-optimize"

state:
  record_file: "config/tltg_optimized_state.yaml"

preflight:
  required_files:
    - "config/printer.cfg"
    - "config/klipper-macros-qd/bed_mesh.cfg"
    - "config/klipper-macros-qd/filament.cfg"
    - "config/klipper-macros-qd/kinematics.cfg"
    - "config/klipper-macros-qd/start_end.cfg"

  required_sections:
    - file: "config/printer.cfg"
      section: "save_variables"
    - file: "config/klipper-macros-qd/bed_mesh.cfg"
      section: "gcode_macro g29"
    - file: "config/klipper-macros-qd/filament.cfg"
      section: "gcode_macro CUT_FILAMENT_1"
    - file: "config/klipper-macros-qd/start_end.cfg"
      section: "gcode_macro print_start"

  required_lines:
    - file: "config/printer.cfg"
      line: "[include klipper-macros-qd/*.cfg]"

install:
  ensure_directories:
    - "config/tltg-optimized-macros"

  managed_tree:
    id: optimized_macro_tree
    source: "klipper/tltg-optimized-macros"
    destination: "config/tltg-optimized-macros"
    mode: mirror
    required_files:
      - "bed_mesh.cfg"
      - "cancel.cfg"
      - "cooling.cfg"
      - "filament.cfg"
      - "globals.cfg"
      - "heaters.cfg"
      - "helpers.cfg"
      - "kinematics.cfg"
      - "motion.cfg"
      - "offset.cfg"
      - "start_end.cfg"

  ensure_lines:
    - id: include_optimized_macros
      file: "config/printer.cfg"
      line: "[include tltg-optimized-macros/*.cfg]"
      after: "[include klipper-macros-qd/*.cfg]"

  source_patches:
    - id: qidi_homing
      source: "klipper/qidi/homing.py"
      destination: "klippy/extras/homing.py"
      variants:
        - firmware: "01.01.06.03"
          expected_sha256: "89428b465b7f3d62bd8b65b3155b8aa8e93cd917f59779e40a246b5d89ff8d71"
          desired_sha256: "32a8545c440a640b67d1f88f0bbc6ed86b0302c96efda3af8a39ebf22e25fda3"
        - firmware: "01.01.06.04"
          expected_sha256: "ff0439f8b9e702537f66c16508f7b0a137b27cff51eb653aa951172d3e5184a0"
          desired_sha256: "32a8545c440a640b67d1f88f0bbc6ed86b0302c96efda3af8a39ebf22e25fda3"
        - firmware: "01.01.06.04"
          source: "klipper/qidi/homing-sync-reset.py"
          expected_sha256: "0310d9ed0a838b2a7ecff8cd2ec15488b1ae3d8f165a458addd16d8366a60761"
          desired_sha256: "09a57808075b7022ad65619f5a23deeec80c5d682a43e8ee101f8d62c984f33a"
        - firmware: "01.01.06.05"
          source: "klipper/qidi/homing-sync-reset.py"
          expected_sha256: "0310d9ed0a838b2a7ecff8cd2ec15488b1ae3d8f165a458addd16d8366a60761"
          desired_sha256: "09a57808075b7022ad65619f5a23deeec80c5d682a43e8ee101f8d62c984f33a"

